        <rect x="24" y="66" width="96" height="12" rx="6" fill="#7db9f4"/>
        <rect x="24" y="88" width="122" height="12" rx="6" fill="#c6d7e9"/>
      </g>
      <g transform="translate(220 132)">
        <rect x="0" y="0" width="170" height="124" rx="20" fill="#f8fbff"/>
        <text x="24" y="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#162940">Assessment</text>
        <rect x="24" y="66" width="116" height="12" rx="6" fill="#7db9f4"/>
        <rect x="24" y="88" width="94" height="12" rx="6" fill="#c6d7e9"/>
      </g>
      <g transform="translate(30 282)">
        <rect x="0" y="0" width="170" height="124" rx="20" fill="#f8fbff"/>
        <text x="24" y="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#162940">Content</text>
        <rect x="24" y="66" width="106" height="12" rx="6" fill="#a9c99f"/>
        <rect x="24" y="88" width="126" height="12" rx="6" fill="#c6d7e9"/>
      </g>
      <g transform="translate(220 282)">
        <rect x="0" y="0" width="170" height="124" rx="20" fill="#f8fbff"/>
        <text x="24" y="43" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#162940">AI ready</text>
        <rect x="24" y="66" width="88" height="12" rx="6" fill="#a9c99f"/>
        <rect x="24" y="88" width="130" height="12" rx="6" fill="#c6d7e9"/>
