      <rect x="30" y="450" width="360" height="46" rx="14" fill="#2878d8"/>
      <text x="210" y="481" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">Source only public release</text>
