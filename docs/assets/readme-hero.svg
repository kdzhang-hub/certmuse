<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CertMuse product overview</title>
  <desc id="desc">A README visual showing CertMuse learner, operations, content, assessment, and AI extension surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.52" stop-color="#eef6fc"/>
      <stop offset="1" stop-color="#f6f4ea"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f9fbff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#16385f" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="135" r="220" fill="#b9d7f6" opacity="0.46"/>
  <circle cx="140" cy="810" r="260" fill="#d7e7d4" opacity="0.52"/>
  <path d="M0 720 C260 650 450 760 690 690 C930 620 1100 690 1600 580 L1600 900 L0 900 Z" fill="#ffffff" opacity="0.48"/>

  <g transform="translate(118 112)">
    <rect x="0" y="0" width="1364" height="676" rx="34" fill="url(#panel)" filter="url(#shadow)" stroke="#d7e6f5"/>

    <g transform="translate(58 58)">
      <rect x="0" y="0" width="92" height="92" rx="24" fill="#2878d8"/>
      <text x="46" y="58" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">CM</text>
      <text x="0" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="72" font-weight="850" fill="#162940">CertMuse</text>
      <text x="0" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" fill="#536b86">Open source for certification learning and content operations.</text>

      <g transform="translate(0 274)">
        <rect x="0" y="0" width="206" height="72" rx="16" fill="#2878d8"/>
        <text x="103" y="45" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="780" fill="#fff">Learner journey</text>
        <rect x="224" y="0" width="206" height="72" rx="16" fill="#1f3855"/>
        <text x="327" y="45" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="780" fill="#fff">Admin console</text>
        <rect x="448" y="0" width="206" height="72" rx="16" fill="#315d40"/>
        <text x="551" y="45" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="780" fill="#fff">Domain API</text>
      </g>

      <g transform="translate(0 410)">
