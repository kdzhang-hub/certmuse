<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">服务治理案例架构图</title>
  <desc id="desc">客户端经网关调用多个服务，服务注册中心和监控平台为服务治理提供支持。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5c7c99" /></marker>
  </defs>
  <rect width="960" height="420" fill="#f7fafc" />
  <rect x="44" y="162" width="156" height="88" rx="12" fill="#e8f2ff" stroke="#5b8fd8" stroke-width="2" />
  <text x="122" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#24415e">客户端</text>
  <text x="122" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#58718a">Web / App</text>
  <rect x="300" y="150" width="176" height="112" rx="12" fill="#eaf8ef" stroke="#4caa70" stroke-width="2" />
  <text x="388" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#24583a">API 网关</text>
  <text x="388" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b765d">路由 · 限流 · 熔断</text>
  <rect x="592" y="56" width="166" height="78" rx="10" fill="#fff4df" stroke="#d69c3e" stroke-width="2" />
  <text x="675" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#7a5014">订单服务</text>
  <rect x="592" y="171" width="166" height="78" rx="10" fill="#fff4df" stroke="#d69c3e" stroke-width="2" />
  <text x="675" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#7a5014">库存服务</text>
  <rect x="592" y="286" width="166" height="78" rx="10" fill="#fff4df" stroke="#d69c3e" stroke-width="2" />
  <text x="675" y="331" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#7a5014">支付服务</text>
  <rect x="802" y="72" width="122" height="88" rx="10" fill="#f3efff" stroke="#8b70c8" stroke-width="2" />
  <text x="863" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#563d8f">服务注册</text>
  <text x="863" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#563d8f">与发现</text>
  <rect x="802" y="258" width="122" height="88" rx="10" fill="#f3efff" stroke="#8b70c8" stroke-width="2" />
  <text x="863" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#563d8f">监控追踪</text>
  <text x="863" y="321" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#563d8f">告警</text>
  <path d="M200 206H288" stroke="#5c7c99" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M476 206H560V95H580M560 206H580M560 206V325H580" fill="none" stroke="#5c7c99" stroke-width="3" marker-end="url(#arrow)" />
