server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # API must be proxied before the SPA fallback. This prevents GET requests
    # from receiving index.html and POST /auth/login from returning HTTP 405.
    location ^~ /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /student-index.html {
        internal;
    }

    location = /learning {
        try_files $uri /student-index.html;
    }

    location ^~ /learning/ {
        try_files $uri /student-index.html;
    }

    location ^~ /student-assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
