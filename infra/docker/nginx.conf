server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /prod-api/resource/message {
        proxy_pass http://backend:8080/resource/message;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 90s;
        add_header X-Accel-Buffering no;
        # Ticket is a secret. Do not include its query string in access logs.
        access_log off;
    }

    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Pre-signed MinIO links are signed for the internal endpoint. Browsers
    # cannot resolve that Docker-only host, so retain its Host header while
    # proxying the request through this public frontend origin.
    location ~ ^/oss-proxy/(?<oss_host>(?:host\.docker\.internal|minio|127\.0\.0\.1):9000)/(?<oss_path>.*)$ {
        rewrite ^/oss-proxy/(?:host\.docker\.internal|minio|127\.0\.0\.1):9000/(.*)$ /$1 break;
        proxy_pass http://${MINIO_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $oss_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Hashed Vite chunks are immutable while they exist. When a running browser
    # tab requests a chunk from the previous image, return a one-shot reload
    # module instead of falling through to index.html (which is not JavaScript).
    location ~ ^/assets/.+\.js$ {
        try_files $uri /stale-chunk-reload.js;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /stale-chunk-reload.js {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # The learner SPA shares this origin with unified login so its localStorage
    # token remains available after the server-authoritative entry redirect.
    location = /student-index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /learning {
        try_files $uri /student-index.html;
    }

    location ^~ /learning/ {
        try_files $uri /student-index.html;
    }

    location ^~ /student-assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
